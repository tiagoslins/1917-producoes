<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>1917 Produções</title>
<style>html,body{margin:0;background:#050505;color:#f5f4ef;font-family:Arial,sans-serif}body{min-height:100vh}</style>
<script>
(function(){
  var path=window.location.pathname;
  var search=window.location.search;
  var hash=window.location.hash;
  var isGithub=window.location.hostname.endsWith('github.io');
  var base=isGithub?'/1917-producoes':'';
  var route=path;
  if(base && route.indexOf(base)===0){route=route.slice(base.length)||'/';}
  var target=(base||'/');
  if(target.charAt(target.length-1)!=='/')target+='/';
  var params=new URLSearchParams(search);
  params.set('route',route);
  window.location.replace(target+'?'+params.toString()+hash);
})();
</script>
</head>
<body></body>
</html>
