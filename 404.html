<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1917 Produções</title>
<meta name="theme-color" content="#050505">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f5f4ef}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(100%,1200px);display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end}.code{font-size:clamp(120px,24vw,320px);font-weight:700;line-height:.72;letter-spacing:-.09em}.info{max-width:360px;font-family:monospace;text-transform:uppercase;font-size:11px;line-height:1.6;letter-spacing:.08em}.info strong{display:block;font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:1;margin-bottom:18px;letter-spacing:-.04em}.info a{display:inline-block;margin-top:24px;color:#f5f4ef;text-decoration:none;border-bottom:1px solid #f5f4ef;padding-bottom:5px}.info a:hover{color:#a72b25;border-color:#a72b25}@media(max-width:700px){.wrap{grid-template-columns:1fr;align-items:start}.code{font-size:42vw}.info{max-width:100%}}
</style>
</head>
<body>
<main class="wrap">
  <div class="code">404</div>
  <div class="info">
    <strong>Esta página não existe.</strong>
    <span>1917 Produções / voltar ao início</span>
    <a href="/">1917 Produções →</a>
  </div>
</main>
<script>
(function(){
  var path=window.location.pathname.replace(/\/+$/,'')||'/';
  var base=window.location.hostname.endsWith('github.io')?'/1917-producoes':'';
  if(base && path.indexOf(base)===0) path=path.slice(base.length)||'/';
  var routes={
    '/':'home',
    '/projetos/':'projetos',
    '/projetos/the-velvet-margin/':'velvet',
    '/projetos/memorias-sonoras/':'memorias',
    '/projetos/sociedade-em-debate/':'sociedade',
    '/cultura/':'cultura',
    '/audiovisual/':'audiovisual',
    '/processo/':'processo',
    '/sobre/':'sobre',
    '/parceiros/':'parceiros',
    '/contato/':'contato'
  };
  var key=routes[path];
  if(key){
    var target=base+'/#'+key;
    window.setTimeout(function(){window.location.replace(target)},250);
  }
})();
</script>
</body>
</html>
